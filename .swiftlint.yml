excluded:
  - .build
  - CircuitTimerKit/.build
  - CircuitTimerSnapshotKit/.build
  - DerivedData
  # Scratch files of scripts/tests, such as the lint rules' fixtures, which break rules on purpose.
  - .test-scripts

allow_zero_lintable_files: true

disabled_rules:
  - todo # replaced by the todo_with_ticket custom rule
  - nesting # TCA features nest State/Action/View enums by design
  - trailing_comma

opt_in_rules:
  - closure_body_length
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - final_test_case
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - operator_usage_whitespace
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_over_fileprivate
  - private_swiftui_state
  - redundant_nil_coalescing
  - redundant_sendable
  - reduce_into
  - shorthand_optional_binding
  - sorted_first_last
  - sorted_imports
  - static_over_final_class
  - toggle_bool
  - unhandled_throwing_task
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

line_length:
  warning: 140
  ignores_interpolated_strings: true

file_length:
  warning: 750

type_body_length:
  warning: 500

function_body_length:
  warning: 150

closure_body_length:
  warning: 150

cyclomatic_complexity:
  warning: 20
  ignores_case_statements: true

identifier_name:
  excluded:
    - id
    - xs
    - s
    - m
    - l
    - xl

switch_case_alignment:
  indented_cases: true

sorted_imports:
  grouping: attributes

custom_rules:
  no_literal_color:
    name: Literal color
    regex: '(\bColor\((red|white|hue|\.sRGB|\.displayP3|uiColor)\b|\bUIColor\b|#colorLiteral|\bColor\.\w+|\.(foregroundStyle|foregroundColor|tint|background|fill|stroke)\(\.(red|orange|yellow|green|mint|teal|cyan|blue|indigo|purple|pink|brown|white|gray|black|clear|primary|secondary|tertiary)\b)'
    excluded: '/Sources/DesignSystem/'
    message: Use DesignSystem color tokens instead of literal or system colors.
    severity: error

  no_literal_font:
    name: Literal font
    regex: '(\.system\(size:|\bFont\.(custom|system)\(|\.font\(\.(?!token\())'
    excluded: '/Sources/DesignSystem/'
    message: Use DesignSystem typography tokens, .font(.token(_:)), instead of system or literal fonts.
    severity: error

  no_print:
    name: Print
    regex: '\bprint\('
    match_kinds:
      - identifier
    message: Use os.Logger instead of print.
    severity: error

  no_dispatch_main_async:
    name: DispatchQueue.main
    regex: 'DispatchQueue\.main\.async'
    message: Use @MainActor or MainActor.run instead of DispatchQueue.main.
    severity: error

  no_direct_date:
    name: Direct date
    regex: '\bDate\(\)|\bDate\.now\b'
    excluded: '/Tests/'
    message: Read time through @Dependency(\.date) or pass it as a parameter.
    severity: error

  no_direct_uuid:
    name: Direct UUID
    regex: '\bUUID\(\)'
    excluded: '/Tests/'
    message: Generate identifiers through @Dependency(\.uuid).
    severity: error

  no_unstructured_task:
    name: Unstructured task
    regex: '\bTask(\.detached)?\s*(\([^)]*\))?\s*\{'
    included: '/Sources/'
    message: Use a TCA effect instead of an unstructured Task.
    severity: error

  accessibility_identifier_constant:
    name: Accessibility identifier constant
    regex: '\.accessibilityIdentifier\((?!\s*AccessibilityID\.)'
    match_kinds:
      - identifier
    message: Take accessibility identifiers from UITestContract's AccessibilityID, which the UI tests share.
    severity: error

  ui_test_no_sleep:
    name: Sleep in a UI test
    regex: '\b(sleep|usleep)\(|Thread\.sleep'
    included: '/CircuitTimerUITests/'
    match_kinds:
      - identifier
    message: Wait for an element in a Screen instead of sleeping.
    severity: error

  ui_test_waits_in_screens:
    name: Wait outside a Screen
    regex: 'waitForExistence|waitForNonExistence|\bwait\(for:|waitForExpectations|\bexpectation\(|\bfulfillment\(of:|XCTWaiter|XCTNSPredicateExpectation'
    included: '/CircuitTimerUITests/'
    excluded: '/CircuitTimerUITests/(Screens|Support)/'
    match_kinds:
      - identifier
    message: Tests only act and check through Screens, which wait for the app themselves.
    severity: error

  ui_test_launch_only:
    name: App created outside launch
    regex: '\bXCUIApplication(\.init)?\(|\bXCUIApplication\s*=\s*\.init\('
    included: '/CircuitTimerUITests/'
    excluded: '/CircuitTimerUITests/Support/Launch\.swift'
    match_kinds:
      - identifier
      - keyword
      - typeidentifier
    message: Start the app with launch(_:), which selects a scenario; any other launch runs on live data.
    severity: error

  todo_with_ticket:
    name: TODO without ticket
    regex: '\b(TODO|FIXME)\b(?!: \[CT-(([A-Z]+|\d+)-)?\d+\])'
    match_kinds:
      - comment
    message: 'Reference a ticket: // TODO: [CT-123] ...'
    severity: error
