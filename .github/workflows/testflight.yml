name: TestFlight

on:
  push:
    tags: ['v*']

concurrency:
  group: testflight
  # Uploads run one at a time; a new tag waits instead of replacing a pending run (up to 100 pending).
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

jobs:
  upload:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 26\.5' || { ls -d /Applications/Xcode*; exit 1; }

      - name: Require a commit of main that passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME does not point to a commit of main"; exit 1; }
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&status=success" --jq .total_count)
          [ "$passed" -gt 0 ] \
            || { echo "::error::CI on main has not passed for $GITHUB_SHA; wait for it, then re-run this workflow"; exit 1; }

      - name: Cache keys
        id: keys
        run: |
          echo "resolved=${{ hashFiles('CircuitTimerKit/Package.resolved', 'CircuitTimer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}" >> "$GITHUB_OUTPUT"

      - name: Restore package sources
        uses: actions/cache/restore@v6
        with:
          path: .build/SourcePackages
          key: xcode26.5-spm-${{ steps.keys.outputs.resolved }}

      # The build number is the UTC start time, so a re-run of an older run still gets a higher number.
      - name: Archive
        run: |
          build_number=$(date -u +%y%m%d.%H%M%S)
          echo "Build number: $build_number"
          make archive BUILD_NUMBER="$build_number"

      - name: Require the tag to match the version
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw \
            .build/CircuitTimer.xcarchive/Products/Applications/CircuitTimer.app/Info.plist)
          case "$GITHUB_REF_NAME" in
            "v$version" | "v$version"-?*) ;;
            *) echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version"; exit 1 ;;
          esac

      # The identities the export must sign: the team from App.xcconfig, the bundle IDs from the archive.
      - name: Check the archive
        id: archive
        run: |
          python3 -I scripts/verify-export-signing.py archive .build/CircuitTimer.xcarchive
          app=.build/CircuitTimer.xcarchive/Products/Applications/CircuitTimer.app
          {
            echo "team=$(sed -n 's/^DEVELOPMENT_TEAM = //p' Configs/App.xcconfig)"
            echo "app=$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")"
            echo "widgets=$(plutil -extract CFBundleIdentifier raw "$app/PlugIns/CircuitTimerWidgets.appex/Info.plist")"
          } >> "$GITHUB_OUTPUT"

      - name: Write the API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      # The archive is unsigned, so only an export shows whether both bundles keep their App Store signature.
      # An upload leaves no exported files behind, so a separate export to a folder is inspected first: a wrong
      # signature stops the run before anything is uploaded. The upload signs again with the same cloud identity
      # and automatic profiles, so this is strong evidence about the uploaded build, not a proof.
      - name: Export a signed IPA to inspect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ steps.archive.outputs.team }}
          APP_ID: ${{ steps.archive.outputs.app }}
          WIDGETS_ID: ${{ steps.archive.outputs.widgets }}
        run: |
          options="$RUNNER_TEMP/ExportOptions-inspect.plist"
          cp Configs/ExportOptions.plist "$options"
          plutil -replace destination -string export "$options"
          xcodebuild -exportArchive -archivePath .build/CircuitTimer.xcarchive \
            -exportOptionsPlist "$options" -exportPath .build/ExportInspect \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          python3 -I scripts/verify-export-signing.py ipa .build/ExportInspect/CircuitTimer.ipa \
            "$TEAM" "$APP_ID" "$WIDGETS_ID"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: make upload ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"

      - name: Keep the export reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: export-reports
          path: |
            .build/ExportInspect/DistributionSummary.plist
            .build/ExportInspect/Packaging.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
