name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; main runs finish so they can save caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned explicitly: concurrency diagnostics and the resolved package graph depend on the
  # Xcode version, and the runner image's default Xcode changes over time.
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5
  SWIFTLINT_IMAGE: ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057

jobs:
  # Linux, so lint does not take one of the five macOS jobs a Free plan runs at a time.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # SwiftLint's image carries the Swift runtime and SourceKit. Its static Linux binary refuses SourceKit and
      # only warns while it skips the rules that need it, our custom rules among them, so a skip fails the step.
      - name: Lint
        run: |
          set -o pipefail
          make lint SWIFTLINT="docker run --rm -v $PWD:$PWD -w $PWD $SWIFTLINT_IMAGE swiftlint" 2>&1 \
            | tee "$RUNNER_TEMP/lint.log"
          if grep -q 'Skipping enabled rule' "$RUNNER_TEMP/lint.log"; then
            echo "::error::SwiftLint skipped rules; see the log above"
            exit 1
          fi

  build-test:
    runs-on: xcode-27
    # A backstop for a hang in a step without its own timeout; GitHub's default is six hours. It stays above
    # the step timeouts below added together, so a slow run is not cancelled before they report.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -version | grep '^Xcode 27\.1' > /dev/null || { ls -d /Applications/Xcode*; exit 1; }

      # Before the runtime download, so a lockfile mismatch fails in seconds.
      - name: Check lockfiles
        run: make check-resolved

      # The xcode-27 image ships only iOS 27 simulators; the tests run on iOS 26.5. Installing the runtime
      # also creates its default devices, iPhone 17 among them, so a device of our own would be a duplicate.
      - name: Install the iOS 26.5 simulator
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            xcodebuild -downloadPlatform iOS -buildVersion 26.5 && break
            [ "$attempt" -lt 3 ] || exit 1
            echo "::warning::The runtime download failed (attempt $attempt); retrying"
            sleep 30
          done
          xcrun simctl list devices 'iOS 26.5'

      - name: Cache keys
        id: keys
        run: |
          echo "resolved=${{ hashFiles('CircuitTimerKit/Package.resolved', 'CircuitTimer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}" >> "$GITHUB_OUTPUT"

      - name: Restore package sources
        id: spm-cache
        uses: actions/cache/restore@v6
        with:
          path: .build/SourcePackages
          key: xcode27.1-spm-${{ steps.keys.outputs.resolved }}

      - name: Restore DerivedData
        uses: actions/cache/restore@v6
        with:
          path: .build/DerivedData
          key: xcode27.1-dd-${{ steps.keys.outputs.resolved }}-${{ github.sha }}
          restore-keys: |
            xcode27.1-dd-${{ steps.keys.outputs.resolved }}-
            xcode27.1-dd-

      # The tests take 5–10 minutes on this runner, so a hang ends here, and the steps below report what the
      # result bundle holds whether the step timeout leaves it failed or cancelled. A cancelled run (by hand,
      # superseded or past the job timeout) skips them.
      - name: Test the package
        id: test
        timeout-minutes: 25
        run: make test

      - name: Show test failures
        if: ${{ !cancelled() && (steps.test.outcome == 'failure' || steps.test.outcome == 'cancelled') }}
        timeout-minutes: 5
        run: |
          set -o pipefail
          [ -d .build/TestResults.xcresult ] || { echo "No test results: the tests did not start"; exit 0; }
          xcrun xcresulttool get test-results summary --path .build/TestResults.xcresult \
            | jq -r 'def escape: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
                .testFailures[]?
                | "::error title=" + ("\(.targetName)/\(.testIdentifierString)" | escape | gsub(":"; "%3A") | gsub(","; "%2C"))
                + "::" + (.failureText | escape)'

      # The wildcard keeps the bundle's own folder in the artifact, so it opens in Xcode as downloaded.
      - name: Keep the test results
        if: ${{ !cancelled() && (steps.test.outcome == 'failure' || steps.test.outcome == 'cancelled') }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: .build/*.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Build the app
        run: make build-app

      # Pull requests only restore caches, so their revisions do not evict the main branch caches.
      - name: Save package sources
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build/SourcePackages
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: Save DerivedData
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .build/DerivedData
          key: xcode27.1-dd-${{ steps.keys.outputs.resolved }}-${{ github.sha }}
