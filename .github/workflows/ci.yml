name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; main runs finish so they can save caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned explicitly: concurrency diagnostics and the resolved package graph depend on the
  # Xcode version, and the runner image's default Xcode changes over time.
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=27.0
  # After bumping it, push one violation of a custom rule and see lint fail: the image can lint nothing quietly.
  SWIFTLINT_IMAGE: ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057

jobs:
  # Linux, so lint does not take one of the five macOS jobs a Free plan runs at a time.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # SwiftLint's image carries the Swift runtime and SourceKit, and its entrypoint is `swiftlint`. Its static
      # Linux binary refuses SourceKit and only warns while it skips the rules that need it, our custom rules among
      # them, so a skip fails the step.
      - name: Lint
        run: |
          set -o pipefail
          make lint SWIFTLINT="docker run --rm -v $PWD:$PWD -w $PWD $SWIFTLINT_IMAGE" 2>&1 \
            | tee "$RUNNER_TEMP/lint.log"
          if grep -q 'Skipping enabled rule' "$RUNNER_TEMP/lint.log"; then
            echo "::error::SwiftLint skipped rules; see the log above"
            exit 1
          fi

  build-test:
    runs-on: xcode-27
    # A backstop for a hang in a step without its own timeout; GitHub's default is six hours. It stays above
    # the step timeouts below added together, so a slow run is not cancelled before they report.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -version | grep '^Xcode 27\.1' > /dev/null || { ls -d /Applications/Xcode*; exit 1; }

      # Before the caches and the tests, so a lockfile mismatch fails in seconds.
      - name: Check lockfiles
        run: make check-resolved

      - name: Cache keys
        id: keys
        run: |
          echo "resolved=${{ hashFiles('CircuitTimerKit/Package.resolved', 'CircuitTimer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}" >> "$GITHUB_OUTPUT"

      - name: Restore package sources
        id: spm-cache
        uses: actions/cache/restore@v6
        with:
          path: .build/SourcePackages
          key: xcode27.1-spm-${{ steps.keys.outputs.resolved }}

      - name: Restore DerivedData
        uses: actions/cache/restore@v6
        with:
          path: .build/DerivedData
          key: xcode27.1-dd-${{ steps.keys.outputs.resolved }}-${{ github.sha }}
          restore-keys: |
            xcode27.1-dd-${{ steps.keys.outputs.resolved }}-
            xcode27.1-dd-

      # The tests take 5–10 minutes on this runner, so a hang ends here, and the steps below report what the
      # result bundle holds whether the step timeout leaves it failed or cancelled. A cancelled run (by hand,
      # superseded or past the job timeout) skips them.
      # A test runner that cannot reach a cold simulator hangs before connecting, so the device is booted first.
      - name: Boot the simulator
        timeout-minutes: 10
        run: |
          name=$(sed -E 's/.*name=([^,]+).*/\1/' <<< "$DESTINATION")
          os=$(sed -E 's/.*OS=([0-9.]+).*/\1/' <<< "$DESTINATION")
          udid=$(xcrun simctl list devices available -j \
            | jq -r --arg rt "com.apple.CoreSimulator.SimRuntime.iOS-${os//./-}" --arg name "$name" \
              '.devices[$rt][]? | select(.name == $name) | .udid' | head -1)
          [ -n "$udid" ] || { echo "::error::No $name on iOS $os"; xcrun simctl list devices available; exit 1; }
          xcrun simctl bootstatus "$udid" -b

      # A runner that still hangs before connecting tests nothing, so it gets one retry; a failing test gets none.
      # Collecting diagnostics would add ten minutes to each hang.
      - name: Test the package
        id: test
        timeout-minutes: 35
        run: |
          set -o pipefail
          make test TEST_FLAGS='-collect-test-diagnostics never' 2>&1 | tee "$RUNNER_TEMP/test.log" && exit 0
          grep -q 'The test runner hung before establishing connection' "$RUNNER_TEMP/test.log" || exit 1
          echo "::warning::The test runner hung before connecting; retrying once"
          make test TEST_FLAGS='-collect-test-diagnostics never'

      # Tests that wait in real time add up on the runner's few cores; the step summary names the slowest.
      - name: Show the slowest tests
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        timeout-minutes: 5
        # Diagnostics only: a changed result-bundle format must not fail a run whose tests passed.
        continue-on-error: true
        run: |
          set -o pipefail
          [ -d .build/TestResults.xcresult ] || { echo "No test results: the tests did not start"; exit 0; }
          {
            echo '| Seconds | Test |'
            echo '|---:|---|'
            xcrun xcresulttool get test-results tests --path .build/TestResults.xcresult \
              | jq -r '[.. | objects | select(.nodeType == "Test Case" and .durationInSeconds != null)]
                  | sort_by(-.durationInSeconds) | .[:20][]
                  | "| \(.durationInSeconds * 10 | round / 10) | `\(.nodeIdentifier)` |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Show test failures
        if: ${{ !cancelled() && (steps.test.outcome == 'failure' || steps.test.outcome == 'cancelled') }}
        timeout-minutes: 5
        run: |
          set -o pipefail
          [ -d .build/TestResults.xcresult ] || { echo "No test results: the tests did not start"; exit 0; }
          xcrun xcresulttool get test-results summary --path .build/TestResults.xcresult \
            | jq -r 'def escape: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
                .testFailures[]?
                | "::error title=" + ("\(.targetName)/\(.testIdentifierString)" | escape | gsub(":"; "%3A") | gsub(","; "%2C"))
                + "::" + (.failureText | escape)'

      # The wildcard keeps the bundle's own folder in the artifact, so it opens in Xcode as downloaded.
      - name: Keep the test results
        if: ${{ !cancelled() && (steps.test.outcome == 'failure' || steps.test.outcome == 'cancelled') }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: .build/*.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Build the app
        run: make build-app

      # Pull requests only restore caches, so their revisions do not evict the main branch caches.
      - name: Save package sources
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build/SourcePackages
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: Save DerivedData
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .build/DerivedData
          key: xcode27.1-dd-${{ steps.keys.outputs.resolved }}-${{ github.sha }}
