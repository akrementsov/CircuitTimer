name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; main runs finish so they can save caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned explicitly: concurrency diagnostics and the resolved package graph depend on the
  # Xcode version, and the runner image's default Xcode changes over time.
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=27.0
  # After bumping it, push one violation of a custom rule and see lint fail: the image can lint nothing quietly.
  SWIFTLINT_IMAGE: ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057

jobs:
  # Linux, so lint does not take one of the five macOS jobs a Free plan runs at a time.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # SwiftLint's image carries the Swift runtime and SourceKit, and its entrypoint is `swiftlint`. Its static
      # Linux binary refuses SourceKit and only warns while it skips the rules that need it, our custom rules among
      # them, so a skip fails the step.
      - name: Lint
        run: |
          set -o pipefail
          make lint SWIFTLINT="docker run --rm -v $PWD:$PWD -w $PWD $SWIFTLINT_IMAGE" 2>&1 \
            | tee "$RUNNER_TEMP/lint.log"
          if grep -q 'Skipping enabled rule' "$RUNNER_TEMP/lint.log"; then
            echo "::error::SwiftLint skipped rules; see the log above"
            exit 1
          fi

      # Here the scripts' tests run with GNU tools and mawk, and the tests that lint use the same image.
      - name: Test the scripts
        run: make test-scripts SWIFTLINT="docker run --rm -v $PWD:$PWD -w $PWD $SWIFTLINT_IMAGE"

  build-test:
    runs-on: xcode-27
    # A backstop for a hang in a step without its own timeout; GitHub's default is six hours. It stays above
    # the step timeouts below added together, so a slow run is not cancelled before they report.
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@v7

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -version | grep '^Xcode 27\.1' > /dev/null || { ls -d /Applications/Xcode*; exit 1; }

      # Before the caches and the tests, so a lockfile mismatch fails in seconds.
      - name: Check lockfiles
        id: lockfiles
        run: make check-resolved

      - name: Cache keys
        id: keys
        run: |
          echo "resolved=${{ hashFiles('CircuitTimerKit/Package.resolved', 'CircuitTimerSnapshotKit/Package.resolved', 'CircuitTimer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}" >> "$GITHUB_OUTPUT"

      - name: Restore package sources
        id: spm-cache
        uses: actions/cache/restore@v6
        with:
          path: .build/SourcePackages
          key: xcode27.1-spm-${{ steps.keys.outputs.resolved }}

      - name: Restore DerivedData
        uses: actions/cache/restore@v6
        with:
          path: .build/DerivedData
          key: xcode27.1-dd-${{ steps.keys.outputs.resolved }}-${{ github.sha }}
          restore-keys: |
            xcode27.1-dd-${{ steps.keys.outputs.resolved }}-
            xcode27.1-dd-

      # The tests take 5–10 minutes on this runner, so a hang ends here, and the steps below report what the
      # result bundle holds whether the step timeout leaves it failed or cancelled. A cancelled run (by hand,
      # superseded or past the job timeout) skips them.
      # A test runner that cannot reach a cold simulator hangs before connecting, so the device is booted first.
      - name: Boot the simulator
        timeout-minutes: 10
        run: |
          name=$(sed -E 's/.*name=([^,]+).*/\1/' <<< "$DESTINATION")
          os=$(sed -E 's/.*OS=([0-9.]+).*/\1/' <<< "$DESTINATION")
          udid=$(xcrun simctl list devices available -j \
            | jq -r --arg rt "com.apple.CoreSimulator.SimRuntime.iOS-${os//./-}" --arg name "$name" \
              '.devices[$rt][]? | select(.name == $name) | .udid' | head -1)
          [ -n "$udid" ] || { echo "::error::No $name on iOS $os"; xcrun simctl list devices available; exit 1; }
          xcrun simctl bootstatus "$udid" -b

      # A runner that still hangs before connecting tests nothing, so scripts/run-tests.sh retries it once; a failing
      # package test gets no retry.
      - name: Test the package
        id: test
        timeout-minutes: 35
        run: make test

      # Built even when a package test failed, so the UI tests still report; never on mismatched lockfiles. The app
      # with its UI tests, into the next step's DerivedData: about 4 minutes cold.
      - name: Build the app and its UI tests
        id: build-ui-tests
        if: ${{ !cancelled() && steps.lockfiles.outcome == 'success' }}
        timeout-minutes: 20
        run: make build-ui-tests

      # About 2 minutes: the step above built everything. A failing UI test runs once more and is reported as flaky
      # if it then passes; a hung runner gets one more run as above.
      - name: Test the UI
        id: test-ui
        if: ${{ !cancelled() && steps.build-ui-tests.outcome == 'success' }}
        timeout-minutes: 25
        run: make test-ui

      # The package checks warnings strictly; the host build compiles it as a dependency with warnings suppressed.
      # Each build still runs after a failed test, provided the lockfiles agree.
      - name: Build the snapshot kit
        id: build-snapshot-kit
        if: ${{ !cancelled() && steps.lockfiles.outcome == 'success' }}
        timeout-minutes: 10
        run: make build-snapshot-kit

      # Into the next step's DerivedData, so compilation errors are reported separately from image differences.
      - name: Build the snapshot tests
        id: build-snapshots
        if: ${{ !cancelled() && steps.lockfiles.outcome == 'success' }}
        timeout-minutes: 20
        run: make build-snapshots

      - name: Test the snapshots
        id: test-snapshots
        if: ${{ !cancelled() && steps.build-snapshots.outcome == 'success' }}
        timeout-minutes: 15
        env:
          TEST_RUNNER_SNAPSHOT_RASTER_DIAGNOSTICS: '1'
          TEST_RUNNER_SNAPSHOT_RASTER_STANDARD_RANGE: '1'
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string || echo '::warning::CPU brand is unavailable on this runner'
          make test-snapshots

      # Every result bundle: its failed tests, tests that passed only on a retry, and the slowest tests, which add up
      # on the runner's few cores. Diagnostics only: a changed result-bundle format must not fail a run whose tests
      # passed.
      - name: Report test results
        id: report
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        continue-on-error: true
        run: scripts/report-test-results.sh .build/TestResults/*.xcresult

      # The folder keeps each bundle's own folder in the artifact, so it opens in Xcode as downloaded; the logs go along.
      # A test step past its timeout may end cancelled rather than failed; its log is kept either way.
      - name: Keep the test results
        if: >-
          ${{ !cancelled() && (failure() || steps.report.outputs.upload == 'true'
          || steps.test.outcome == 'cancelled' || steps.test-ui.outcome == 'cancelled'
          || steps.test-snapshots.outcome == 'cancelled') }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: .build/TestResults/
          if-no-files-found: ignore
          retention-days: 14

      # Keep the native pixel probe even if this runner happens to match every reference.
      - name: Keep snapshot raster diagnostics
        if: ${{ !cancelled() && steps.build-snapshots.outcome == 'success' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-raster-diagnostics
          path: .build/TestResults/Snapshots-*-artifacts/*-raster.json
          if-no-files-found: warn
          retention-days: 14

      # Pull requests only restore caches, so their revisions do not evict the main branch caches.
      - name: Save package sources
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build/SourcePackages
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: Save DerivedData
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .build/DerivedData
          key: xcode27.1-dd-${{ steps.keys.outputs.resolved }}-${{ github.sha }}

  # Each push to main saves a DerivedData cache of its own, about 1 GB against the repository's 10 GB, and runs restore
  # only the newest, so the older ones go before they evict the package sources.
  prune-caches:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete older DerivedData caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          gh cache list --ref refs/heads/main --sort created_at --order desc --limit 100 --json id,key \
            --jq '[.[] | select(.key | test("^xcode[0-9.]+-dd-"))] | .[1:][] | .id' \
            | while read -r id; do gh cache delete "$id"; done
